name: RSL Tools

on:
  push:
    paths:
      - "contrib/rsl-tools/**"
      - ".github/workflows/rsl-tools.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: contrib/rsl-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Test
        run: python -m pytest -q tests
      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name RSL-Tools
          --add-data "rsltools/data;rsltools/data" rsl_tools.py
      - uses: actions/upload-artifact@v4
        with:
          name: RSL-Tools-win64
          path: contrib/rsl-tools/dist/RSL-Tools.exe
